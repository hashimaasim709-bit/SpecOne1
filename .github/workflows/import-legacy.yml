name: Import old bookings

# One-click copy of customers, vehicles and bookings from the previous SpecOne site's
# database into the new one. Run it from the Actions tab → "Import old bookings" → Run workflow.
# The old database is only read. Safe to run more than once (nothing is duplicated).
# No customer details are printed in the logs.
on:
  workflow_dispatch:
    inputs:
      old_database:
        description: Old site's D1 database name — leave as "auto" to find it automatically
        required: false
        default: auto
        type: string

concurrency:
  group: import-legacy
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OLD_DATABASE: ${{ inputs.old_database }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the new database has its tables
        run: npx wrangler d1 migrations apply DB --remote
      - name: Read the old bookings
        run: node scripts/import-legacy.mjs --d1 "${OLD_DATABASE:-auto}" legacy-import.sql
      - name: Copy them into the new database
        run: npx wrangler d1 execute DB --remote --yes --file legacy-import.sql
      - name: Summary
        run: |
          npx wrangler d1 execute DB --remote --json --command "SELECT COUNT(*) AS imported FROM bookings WHERE internal_notes = 'Imported from the previous system'" > count.json
          node -e "const r=JSON.parse(require('fs').readFileSync('count.json','utf8').replace(/^[^\[]*/,''));console.log('Old bookings now in the new site:', r[0].results[0].imported)" | tee -a "$GITHUB_STEP_SUMMARY"
