name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (server + browser)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build check (no upload)
        run: npx wrangler deploy --dry-run --outdir dist
