name: Deploy

# Every push to main is checked, migrated and deployed. Cloudflare swaps versions
# atomically, so visitors never see a half-deployed site (#90).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The first deploy creates the D1 database automatically; the Worker applies
      # its own migrations on start-up, so there is no separate migration step.
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Smoke test
        if: ${{ vars.PUBLIC_URL != '' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "${{ vars.PUBLIC_URL }}/healthz"
